[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-lan-cli"
version = "0.1.0"
description = "LAN-only printer CLI with private local YAML configuration"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["paho-mqtt>=2.1.0,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[project.scripts]
bambu-lan = "bambu_lan_cli.cli:main"

[tool.setuptools.package-data]
bambu_lan_cli = ["hms_errors.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
